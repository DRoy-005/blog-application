
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSpace | Home</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>BlogSpace</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Share Your Stories With The World</h2>

            <p>
                Discover interesting stories, share your thoughts,
                and connect with other writers.
            </p>

            <button id="exploreBtn">Explore Blogs</button>
        </section>

        

<section class="blogs" id="blogs">
    <h2>Latest Blogs</h2>

    <p class="section-description">
        Explore stories from our community.
    </p>

    <div class="blog-controls">
        <input
            type="search"
            id="searchInput"
            placeholder="Search blogs..."
        >

        <select id="categoryFilter">
            <option value="All">All Categories</option>
            <option value="Travel">Travel</option>
            <option value="Lifestyle">Lifestyle</option>
            <option value="Technology">Technology</option>
        </select>
    </div>

    <div class="blog-grid" id="blogGrid">
        <!-- JavaScript will insert blog cards here -->
    </div>

    <p id="emptyMessage" hidden>
        No blogs found. Try another search!
    </p>
</section>


    </main>

    <footer>
        <p>&copy; 2026 BlogSpace. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>

</body>
</html>
